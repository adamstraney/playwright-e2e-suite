<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Surgical Social Hub</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-2: #121212;
    --border: #1f1f1f;
    --border-soft: #171717;
    --text-primary: #f5f5f5;
    --text-secondary: #8a8a8e;
    --text-tertiary: #55555a;

    --accent-instagram: #e1306c;
    --accent-x: #ffffff;
    --accent-linkedin: #0a66c2;
    --accent-tiktok: #25f4ee;

    --timer-green: #30d158;
    --timer-amber: #ff9f0a;
    --timer-red: #ff3b30;

    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;

    --shadow-card: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px rgba(0,0,0,0.55);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    height: 100%;
    overscroll-behavior-y: none;
  }

  body{
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app{
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(18px + var(--safe-top)) 18px calc(28px + var(--safe-bottom));
    position: relative;
  }

  /* ============================================================
     HEADER
     ============================================================ */
  .header{
    text-align: center;
    margin-bottom: 18px;
  }

  .header .eyebrow{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin: 0 0 4px;
  }

  .header h1{
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
    background: linear-gradient(135deg, #ffffff 0%, #a9a9b2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ============================================================
     TIMER
     ============================================================ */
  .timer-card{
    background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 20px 18px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
  }

  .timer-card::before{
    content: "";
    position: absolute;
    top: -60%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(circle at 30% 20%, rgba(48,209,88,0.08), transparent 60%);
    pointer-events: none;
    transition: background 0.6s ease;
  }

  .timer-card.state-amber::before{
    background: radial-gradient(circle at 30% 20%, rgba(255,159,10,0.10), transparent 60%);
  }

  .timer-card.state-red::before{
    background: radial-gradient(circle at 30% 20%, rgba(255,59,48,0.14), transparent 60%);
  }

  .timer-label{
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin: 0 0 10px;
    position: relative;
  }

  .timer-display{
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0 0 18px;
    color: var(--timer-green);
    transition: color 0.4s ease, text-shadow 0.4s ease;
    text-shadow: 0 0 30px rgba(48,209,88,0.25);
    position: relative;
  }

  .timer-display.state-amber{
    color: var(--timer-amber);
    text-shadow: 0 0 30px rgba(255,159,10,0.3);
  }

  .timer-display.state-red{
    color: var(--timer-red);
    text-shadow: 0 0 30px rgba(255,59,48,0.35);
    animation: flash-red 1s ease-in-out infinite;
  }

  @keyframes flash-red{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .timer-progress-track{
    width: 100%;
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.07);
    overflow: hidden;
    margin-bottom: 18px;
    position: relative;
  }

  .timer-progress-fill{
    height: 100%;
    width: 100%;
    border-radius: 4px;
    background: var(--timer-green);
    transition: width 1s linear, background 0.4s ease;
  }

  .timer-progress-fill.state-amber{ background: var(--timer-amber); }
  .timer-progress-fill.state-red{ background: var(--timer-red); }

  .timer-controls{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    position: relative;
  }

  .timer-btn{
    appearance: none;
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.15s ease, background 0.2s ease;
    font-family: inherit;
  }

  .timer-btn:active{
    transform: scale(0.96);
  }

  .timer-btn-primary{
    background: var(--text-primary);
    color: #000000;
  }

  .timer-btn-primary.is-running{
    background: var(--surface-2);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }

  .timer-btn-secondary{
    background: var(--surface-2);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  /* ============================================================
     SECTION LABEL
     ============================================================ */
  .section-label{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin: 0 0 12px 4px;
  }

  /* ============================================================
     CARD GRID
     ============================================================ */
  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .card{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    gap: 22px;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 18px 16px;
    min-height: 130px;
    box-shadow: var(--shadow-card);
    transition: transform 0.12s ease, border-color 0.2s ease, background 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .card:active{
    transform: scale(0.96);
    border-color: var(--card-accent, var(--border));
  }

  .card::after{
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 85% 0%, var(--card-accent, transparent) 0%, transparent 45%);
    opacity: 0.14;
    pointer-events: none;
  }

  .card-icon{
    width: 44px;
    height: 44px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .card-icon svg{
    width: 22px;
    height: 22px;
    display: block;
  }

  .card-copy{
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
  }

  .card-title{
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }

  .card-sub{
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-sub .arrow{
    font-size: 12px;
    transform: translateY(-0.5px);
    transition: transform 0.15s ease;
  }

  .card:active .card-sub .arrow{
    transform: translate(2px, -0.5px);
  }

  .card-instagram{ --card-accent: #e1306c; }
  .card-x{ --card-accent: #ffffff; }
  .card-linkedin{ --card-accent: #0a66c2; }
  .card-tiktok{ --card-accent: #25f4ee; }

  /* ============================================================
     FOOTER NOTE
     ============================================================ */
  .footer-note{
    margin-top: auto;
    text-align: center;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-tertiary);
    padding-top: 8px;
  }

  .footer-note strong{
    color: var(--text-secondary);
  }

  /* ============================================================
     MODAL OVERLAY
     ============================================================ */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
    z-index: 999;
  }

  .modal-overlay.is-visible{
    opacity: 1;
    visibility: visible;
  }

  .modal-box{
    width: 100%;
    max-width: 340px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 34px 26px 26px;
    text-align: center;
    transform: translateY(16px) scale(0.97);
    transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .modal-overlay.is-visible .modal-box{
    transform: translateY(0) scale(1);
  }

  .modal-icon{
    font-size: 40px;
    margin-bottom: 14px;
    display: block;
  }

  .modal-title{
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    color: var(--text-primary);
  }

  .modal-body{
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-secondary);
    margin: 0 0 26px;
  }

  .modal-dismiss{
    appearance: none;
    border: none;
    width: 100%;
    padding: 15px 0;
    border-radius: var(--radius-sm);
    background: var(--text-primary);
    color: #000000;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s ease;
  }

  .modal-dismiss:active{
    transform: scale(0.96);
  }

  @media (max-width: 360px){
    .timer-display{ font-size: 54px; }
    .card{ min-height: 122px; padding: 16px 14px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============================================================
       HEADER
       ============================================================ -->
  <header class="header">
    <p class="eyebrow">Mission Control</p>
    <h1>Surgical Social Hub</h1>
  </header>

  <!-- ============================================================
       FOCUS TIMER
       ============================================================ -->
  <section class="timer-card" id="timerCard">
    <p class="timer-label" id="timerLabel">Batching Window</p>
    <p class="timer-display" id="timerDisplay">15:00</p>

    <div class="timer-progress-track">
      <div class="timer-progress-fill" id="timerProgressFill"></div>
    </div>

    <div class="timer-controls">
      <button type="button" class="timer-btn timer-btn-primary" id="startPauseBtn">Start</button>
      <button type="button" class="timer-btn timer-btn-secondary" id="resetBtn">Reset</button>
    </div>
  </section>

  <!-- ============================================================
       DEEP LINK GRID
       ============================================================ -->
  <p class="section-label">Surgical Gateways</p>

  <div class="grid">

    <a class="card card-instagram" href="https://www.instagram.com/direct/inbox/" target="_blank" rel="noopener noreferrer">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="5.5" stroke="#e1306c" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="4.2" stroke="#e1306c" stroke-width="1.8"/>
          <circle cx="17.15" cy="6.85" r="1.15" fill="#e1306c"/>
        </svg>
      </div>
      <div class="card-copy">
        <span class="card-title">Instagram</span>
        <span class="card-sub">DMs<span class="arrow">&#8250;</span></span>
      </div>
    </a>

    <a class="card card-x" href="https://x.com/notifications" target="_blank" rel="noopener noreferrer">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4L20 20M20 4L4 20" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-copy">
        <span class="card-title">X</span>
        <span class="card-sub">Notifications<span class="arrow">&#8250;</span></span>
      </div>
    </a>

    <a class="card card-linkedin" href="https://www.linkedin.com/messaging/" target="_blank" rel="noopener noreferrer">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="4" stroke="#0a66c2" stroke-width="1.8"/>
          <circle cx="8.2" cy="8.4" r="1.15" fill="#0a66c2"/>
          <path d="M8.2 11.2V16.4" stroke="#0a66c2" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M11.6 16.4V13.3C11.6 12 12.5 11.1 13.7 11.1C14.9 11.1 15.7 12 15.7 13.3V16.4" stroke="#0a66c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="card-copy">
        <span class="card-title">LinkedIn</span>
        <span class="card-sub">Messages<span class="arrow">&#8250;</span></span>
      </div>
    </a>

    <a class="card card-tiktok" href="https://www.tiktok.com/messages" target="_blank" rel="noopener noreferrer">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14.5 3.5C14.9 5.4 16.2 6.9 18.1 7.3V10C16.6 10 15.2 9.5 14.1 8.7V14.6C14.1 17.4 11.9 19.6 9.1 19.6C6.3 19.6 4.1 17.4 4.1 14.6C4.1 11.9 6.2 9.7 8.9 9.6V12.4C7.7 12.5 6.8 13.5 6.8 14.6C6.8 15.9 7.8 16.9 9.1 16.9C10.4 16.9 11.4 15.9 11.4 14.6V3.5H14.5Z" stroke="#25f4ee" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="card-copy">
        <span class="card-title">TikTok</span>
        <span class="card-sub">Activity<span class="arrow">&#8250;</span></span>
      </div>
    </a>

  </div>

  <p class="footer-note">Home feeds are not linked on purpose.<br><strong>Engage. Reply. Log off.</strong></p>

</div>

<!-- ============================================================
     TIMEOUT MODAL
     ============================================================ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <span class="modal-icon">&#127793;</span>
    <p class="modal-title">Batching window closed!</p>
    <p class="modal-body">Close your tabs, step away, and touch grass.</p>
    <button type="button" class="modal-dismiss" id="modalDismissBtn">I'm done</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     CONFIG
     ============================================================ */
  var DEFAULT_SECONDS = 15 * 60;   // 15 minute default batching window
  var AMBER_THRESHOLD = 5 * 60;    // under 5:00 remaining -> amber
  var RED_THRESHOLD = 60;          // under 1:00 remaining -> red + flashing
  var TICK_MS = 250;               // repaint rate; accuracy comes from the clock
  var STORAGE_KEY = "surgicalSocialHub.timer.v1";

  /* ============================================================
     STATE
     ============================================================ */
  /* The countdown is derived from the wall clock, never from a tick counter.
     Mobile browsers throttle (and iOS suspends) timers in background tabs, so
     counting ticks would stall or drift the moment you tap through to
     Instagram -- which is precisely when this timer has to stay honest. */
  var endsAt = null;              // wall-clock ms when the window closes (running only)
  var pausedRemaining = DEFAULT_SECONDS;  // seconds left while idle/paused
  var isRunning = false;
  var hasExpired = false;
  var intervalId = null;

  /* ============================================================
     DOM REFS
     ============================================================ */
  var timerCard = document.getElementById("timerCard");
  var timerDisplay = document.getElementById("timerDisplay");
  var timerProgressFill = document.getElementById("timerProgressFill");
  var startPauseBtn = document.getElementById("startPauseBtn");
  var resetBtn = document.getElementById("resetBtn");
  var modalOverlay = document.getElementById("modalOverlay");
  var modalDismissBtn = document.getElementById("modalDismissBtn");

  /* ============================================================
     HELPERS
     ============================================================ */
  function formatTime(totalSecs){
    var mins = Math.floor(totalSecs / 60);
    var secs = totalSecs % 60;
    var minsStr = mins < 10 ? "0" + mins : "" + mins;
    var secsStr = secs < 10 ? "0" + secs : "" + secs;
    return minsStr + ":" + secsStr;
  }

  function remainingSeconds(){
    if (isRunning && endsAt !== null){
      return Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
    }
    return Math.max(0, pausedRemaining);
  }

  function currentStateClass(){
    var left = remainingSeconds();
    if (left <= RED_THRESHOLD) return "state-red";
    if (left <= AMBER_THRESHOLD) return "state-amber";
    return "";
  }

  function applyStateClasses(){
    var stateClass = currentStateClass();

    timerDisplay.classList.remove("state-amber", "state-red");
    timerProgressFill.classList.remove("state-amber", "state-red");
    timerCard.classList.remove("state-amber", "state-red");

    if (stateClass){
      timerDisplay.classList.add(stateClass);
      timerProgressFill.classList.add(stateClass);
      timerCard.classList.add(stateClass);
    }
  }

  function render(){
    var left = remainingSeconds();
    timerDisplay.textContent = formatTime(left);
    timerProgressFill.style.width = ((left / DEFAULT_SECONDS) * 100) + "%";
    applyStateClasses();
  }

  function syncButton(){
    startPauseBtn.textContent = isRunning ? "Pause" : "Start";
    startPauseBtn.classList.toggle("is-running", isRunning);
  }

  /* ============================================================
     PERSISTENCE
     Storage can throw (private browsing, sandboxed iframes such as a
     Notion embed). The timer must still work for the current page view
     when it does, so every access is guarded.
     ============================================================ */
  function saveState(){
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
        endsAt: endsAt,
        pausedRemaining: pausedRemaining,
        isRunning: isRunning,
        hasExpired: hasExpired
      }));
    } catch (err) { /* storage unavailable - run in-memory only */ }
  }

  function loadState(){
    var raw = null;
    try{
      raw = window.localStorage.getItem(STORAGE_KEY);
    } catch (err) { return; }

    if (!raw) return;

    try{
      var saved = JSON.parse(raw);
      if (!saved || typeof saved !== "object") return;

      isRunning = saved.isRunning === true;
      hasExpired = saved.hasExpired === true;
      endsAt = typeof saved.endsAt === "number" ? saved.endsAt : null;
      pausedRemaining = typeof saved.pausedRemaining === "number"
        ? saved.pausedRemaining
        : DEFAULT_SECONDS;

      // A running session with no deadline is incoherent - fall back to idle.
      if (isRunning && endsAt === null){
        isRunning = false;
        pausedRemaining = DEFAULT_SECONDS;
      }
    } catch (err) {
      endsAt = null;
      pausedRemaining = DEFAULT_SECONDS;
      isRunning = false;
      hasExpired = false;
    }
  }

  /* ============================================================
     TIMER CONTROLS
     ============================================================ */
  function startInterval(){
    if (intervalId !== null) return;
    intervalId = window.setInterval(tick, TICK_MS);
  }

  function stopInterval(){
    if (intervalId !== null){
      window.clearInterval(intervalId);
      intervalId = null;
    }
  }

  function tick(){
    render();
    if (isRunning && remainingSeconds() <= 0){
      expireTimer();
    }
  }

  function expireTimer(){
    isRunning = false;
    endsAt = null;
    pausedRemaining = 0;
    hasExpired = true;
    stopInterval();
    syncButton();
    render();
    saveState();
    showModal();
  }

  function startTimer(){
    if (isRunning) return;
    var secs = pausedRemaining > 0 ? pausedRemaining : DEFAULT_SECONDS;
    endsAt = Date.now() + (secs * 1000);
    isRunning = true;
    hasExpired = false;
    startInterval();
    syncButton();
    render();
    saveState();
  }

  function pauseTimer(){
    if (!isRunning) return;
    pausedRemaining = remainingSeconds();
    isRunning = false;
    endsAt = null;
    stopInterval();
    syncButton();
    render();
    saveState();
  }

  function resetTimer(){
    isRunning = false;
    endsAt = null;
    pausedRemaining = DEFAULT_SECONDS;
    hasExpired = false;
    stopInterval();
    syncButton();
    render();
    saveState();
  }

  function toggleStartPause(){
    if (isRunning){
      pauseTimer();
    } else {
      startTimer();
    }
  }

  /* Re-read the clock whenever the tab comes back to the foreground, so
     returning from Instagram shows the true time left (or the closing
     modal, if the window ran out while you were away). */
  function resync(){
    if (!isRunning) return;
    render();
    if (remainingSeconds() <= 0){
      expireTimer();
    }
  }

  /* ============================================================
     MODAL
     ============================================================ */
  function showModal(){
    modalOverlay.classList.add("is-visible");
  }

  function hideModal(){
    modalOverlay.classList.remove("is-visible");
    resetTimer();
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  startPauseBtn.addEventListener("click", toggleStartPause);
  resetBtn.addEventListener("click", resetTimer);
  modalDismissBtn.addEventListener("click", hideModal);

  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) resync();
  });
  window.addEventListener("focus", resync);
  window.addEventListener("pageshow", resync);

  /* ============================================================
     INIT
     Restore any session left running by a previous page view, so tapping
     out to a platform and back does not silently hand you a fresh 15:00.
     ============================================================ */
  loadState();

  if (isRunning){
    if (remainingSeconds() <= 0){
      expireTimer();          // window closed while the tab was away
    } else {
      startInterval();
    }
  } else if (hasExpired){
    showModal();              // closing screen was never acknowledged
  }

  syncButton();
  render();

})();
</script>

</body>
</html>
